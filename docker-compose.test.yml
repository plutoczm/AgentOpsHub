services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:?Use scripts/dev.py test-integration}
      POSTGRES_USER: ${TEST_POSTGRES_USER:?Use scripts/dev.py test-integration}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Use scripts/dev.py test-integration}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
