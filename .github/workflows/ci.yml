name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/dev.py check
      - run: uv run --locked python scripts/dev.py hooks
      - run: uv run --locked python scripts/dev.py compose-check

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked python scripts/dev.py init-env
      - run: uv run --locked python scripts/dev.py infra-up
      - run: uv run --locked python scripts/dev.py test-integration
      - if: always()
        run: docker compose down
